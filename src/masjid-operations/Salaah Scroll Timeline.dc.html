<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
<script src="../_theme/chrome.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/noor-design-system-46f42e91-1858-412f-bdb6-560a6cc3df9f/colors_and_type.css">
  <link rel="stylesheet" href="../_theme/poc.css">
  <link rel="stylesheet" href="../_theme/components.css">
  <link rel="stylesheet" href="../_theme/icons.css">
  <script src="../_ds/noor-design-system-46f42e91-1858-412f-bdb6-560a6cc3df9f/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
  <style>
    body{background:var(--canvas-bg);padding:36px 32px 90px;min-height:100vh;box-sizing:border-box}
    ::-webkit-scrollbar{display:none}*{-ms-overflow-style:none;scrollbar-width:none}
  </style>
  <link rel="stylesheet" href="./storyboards/salaah-scroll-timeline.css">
</helmet>

<x-import component="BoardHeader" from="../_theme/board.jsx"
          title="Salaah timings — the scrolling axis"
          subtitle="An exploration against the shipped Timeline of the Day, not a replacement for it. The shipped screen fits the whole day on one phone at ~0.53px per minute, which is why nothing scrolls and why the drag needs its own gain — pull a card 35px and it slides 5. This one takes the calendar-day model instead: a real axis at 4px per minute, scrolled, with the value tracking the finger exactly. Rows then sit at their true positions and the displacement, leader lines and collision pass all disappear, because at this scale there is room for everyone. The cost is the question this page exists to answer — a vertical drag now means two things, so only the two chips take it (touch-action:none) while every other pixel scrolls the day (pan-y). Judge it on two things: whether losing 'every prayer visible at once' is worth direct manipulation, and whether dragging only the chip feels like enough target on a phone."
          hint-size="1440px,168px"></x-import>

<div class="poc-stage">
  <div class="poc-frames">
    <x-import component="SalaahScrollBoard" from="./storyboards/salaah-scroll-timeline.jsx"
              active="{{ active }}" on-select="{{ select }}"
              hint-size="1200px,1400px"></x-import>
  </div>

  <x-import component="BoardLive" from="../_theme/board.jsx" restart="{{ restart }}"
            hint="Fully interactive. Scroll the day by dragging anywhere except a chip; drag a chip to move its value 1:1. Switch the canvas theme — the window bands and the refusal both have to hold in each."
            hint-size="400px,900px">
    <x-import component="IOSDevice" from="../ios-frame.jsx" hint-size="402px,874px">
      <div style="width:100%;height:100%;position:relative;overflow:hidden;background:var(--color-surface-primary)">
        <x-import component="SalaahScrollLive" from="./storyboards/salaah-scroll-timeline.jsx"
                  index="{{ active }}" hint-size="402px,874px"></x-import>
      </div>
    </x-import>
  </x-import>
</div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { active: 0 };

  select = (index) => this.setState({ active: index });
  restart = () => this.setState({ active: 0 });

  renderVals() {
    return {
      active: this.state.active,
      select: this.select,
      restart: this.restart,
    };
  }
}
</script>
</x-dc>
</body>
</html>
